name: matchoose
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  camera: ^0.12.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  google_fonts: ^8.2.1
  image: ^4.10.1
  image_picker: ^1.2.3
  intl: any
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3 

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/templates/
    - assets/templates/tshirt/
    - assets/templates/shirt/
    - assets/templates/pants/
    - assets/templates/shorts/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#C4B29C"
  adaptive_icon_foreground: "assets/icon/icon.png"
  remove_alpha_ios: true